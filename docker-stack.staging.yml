version: '3.8'

secrets:
  app_key:
    external: true
  db_password:
    external: true
  db_password_root:
    external: true

services:

  mysql:
    image: mysql:8.0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: centrivoisme
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password_root
    secrets:
      - db_password
      - db_password_root
    volumes:
      - staging_mysql:/var/lib/mysql
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_password_root) --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/hiragiisme/centrivo:staging-${IMAGE_TAG}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_URL=${STAGING_APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=centrivoisme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - RUN_MIGRATIONS=true
      - LOG_CHANNEL=stderr
    secrets:
      - app_key
      - db_password
    volumes:
      - staging_storage:/var/www/html/storage
    networks:
      - staging-network

volumes:
  staging_storage:
    driver: local
  staging_mysql:
    driver: local

networks:
  staging-network:
    driver: overlay
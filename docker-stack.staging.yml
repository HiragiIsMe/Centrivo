version: '3.8'

services:
  app:
    image: ghcr.io/hiragiisme/centrivo:staging-${IMAGE_TAG}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_KEY_FILE=/run/secrets/app_key
      - APP_URL=${STAGING_APP_URL}
      - DB_HOST=mysql
      - DB_DATABASE=/run/secrets/db_name
      - DB_USERNAME=/run/secrets/db_username
      - DB_PASSWORD=/run/secrets/db_password
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - RUN_MIGRATIONS=true
      - LOG_CHANNEL=stderr
    volumes:
      - staging_storage:/var/www/html/storage
    networks:
      - staging-network
    secrets:
      - app_key
      - db_password

  mysql:
    image: mysql:8.0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_DATABASE: /run/secrets/db_name
      MYSQL_USER: /run/secrets/db_username
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password_root
    volumes:
      - staging_mysql:/var/lib/mysql
    networks:
      - staging-network
    secrets:
      - db_password
      - db_password_root

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
    networks:
      - staging-network

volumes:
  staging_storage:
    driver: local
  staging_mysql:
    driver: local

networks:
  staging-network:
    driver: overlay

secrets:
  app_key:
    external: true
  db_password:
    external: true
  db_password_root:
    external: true
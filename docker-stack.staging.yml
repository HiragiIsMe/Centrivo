version: '3.8'

services:
  app:
    image: ${DOCKER_REGISTRY}/laravel-app:staging-${IMAGE_TAG}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${STAGING_APP_URL}
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - RUN_MIGRATIONS=true
      - LOG_CHANNEL=stderr
    volumes:
      - staging_storage:/var/www/html/storage
    networks:
      - staging-network
    secrets:
      - app_key
      - db_password

  mysql:
    image: mysql:8.0
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - staging_mysql:/var/lib/mysql
    networks:
      - staging-network
    secrets:
      - db_password
      - db_root_password

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
    networks:
      - staging-network

volumes:
  staging_storage:
    driver: local
  staging_mysql:
    driver: local

networks:
  staging-network:
    driver: overlay

secrets:
  app_key:
    external: true
  db_password:
    external: true
  db_root_password:
    external: true
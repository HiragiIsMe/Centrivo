version: '3.8'

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-centrivo}
      MYSQL_USER: ${MYSQL_USER:-centrivoisme}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
    env_file:
      - ./staging.env
    volumes:
      - staging_mysql:/var/lib/mysql
    networks:
      - staging-network

  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 128M
    networks:
      - staging-network

  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-hiragiisme}/centrivo:staging-${IMAGE_TAG:-latest}
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    env_file:
      - ./staging.env
    volumes:
      - staging_storage:/var/www/html/storage
    networks:
      - staging-network

volumes:
  staging_storage:
    driver: local
  staging_mysql:
    driver: local

networks:
  staging-network:
    driver: overlay

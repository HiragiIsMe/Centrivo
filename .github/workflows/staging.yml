name: 🧪 Deploy to Staging

on:
  push:
    branches:
      - develop
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, bcmath, gd, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Copy .env
        run: |
          cp .env.example .env.testing
          echo "APP_ENV=testing" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_DATABASE=laravel_test" >> .env.testing
          echo "DB_USERNAME=root" >> .env.testing
          echo "DB_PASSWORD=root" >> .env.testing

      - name: Generate key
        run: php artisan key:generate
        env:
          APP_ENV: testing

      - name: Run migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: root

  build:
    name: 🏗️ Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-${{ github.sha }}
            type=raw,value=staging-latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy stack file to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/stacks"
          scp docker-stack.staging.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/stacks/

      - name: Deploy to Swarm
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << 'ENDSSH'
            set -e

            # ── Export semua env vars yang dibutuhkan stack ──
            export IMAGE_TAG="${{ github.sha }}"
            export APP_KEY="${{ secrets.STAGING_APP_KEY }}"
            export STAGING_APP_URL="${{ vars.STAGING_APP_URL }}"
            export DB_DATABASE="${{ secrets.STAGING_DB_DATABASE }}"
            export DB_USERNAME="${{ secrets.STAGING_DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}"
            export DB_PASSWORD_ROOT="${{ secrets.STAGING_DB_PASSWORD_ROOT }}"

            # ── Login ke GitHub Container Registry ──
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ── Pull image terbaru ──
            echo "📦 Pulling image..."
            docker pull ghcr.io/${{ github.repository }}:staging-${{ github.sha }}

            # ── Deploy stack ──
            echo "🚀 Deploying stack..."
            docker stack deploy \
              --compose-file ~/stacks/docker-stack.staging.yml \
              --with-registry-auth \
              --prune \
              laravel-staging

            # ── Tunggu service app converge (max 3 menit) ──
            echo "⏳ Waiting for services to converge..."
            TIMEOUT=180
            ELAPSED=0

            while true; do
              REPLICAS=$(docker service ls --filter name=laravel-staging_app --format "{{.Replicas}}")
              echo "   laravel-staging_app replicas: $REPLICAS"

              # Format replicas: "1/1" berarti ready
              if echo "$REPLICAS" | grep -qE "^[0-9]+/[0-9]+$"; then
                READY=$(echo "$REPLICAS" | cut -d'/' -f1)
                DESIRED=$(echo "$REPLICAS" | cut -d'/' -f2)
                if [ "$READY" = "$DESIRED" ] && [ "$DESIRED" != "0" ]; then
                  echo "✅ Service converged!"
                  break
                fi
              fi

              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                echo "❌ Timeout waiting for service to converge."
                docker service ps laravel-staging_app --no-trunc
                exit 1
              fi

              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            # ── Status akhir ──
            echo ""
            echo "📊 Final service status:"
            docker service ls | grep laravel-staging
          ENDSSH

      - name: Health check staging
        run: |
          echo "🔍 Running health check..."
          curl --fail \
               --retry 10 \
               --retry-delay 10 \
               --retry-connrefused \
               --max-time 10 \
               ${{ vars.STAGING_APP_URL }}/api/health || exit 1

      - name: Notify success
        if: success()
        run: echo "✅ Staging deployment successful!"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          echo "Check service logs with:"
          echo "  docker service logs laravel-staging_app --tail 50"
name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hiragiisme/centrivo

jobs:
  guard:
    name: 🛡️ Deployment Guard
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')
    steps:
      - name: Confirm deployment
        run: echo "✅ Production deployment authorized"

  test:
    name: 🧪 Run Tests
    needs: guard
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, bcmath, gd, zip

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Setup test env
        run: |
          cp .env.example .env.testing
          echo "APP_ENV=testing" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_DATABASE=laravel_test" >> .env.testing
          echo "DB_USERNAME=root" >> .env.testing
          echo "DB_PASSWORD=root" >> .env.testing

      - run: php artisan key:generate
        env:
          APP_ENV: testing

      - run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: root

  build:
    name: 🏗️ Build Production Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Generate Env and Deploy
        run: |
          # 1. Create Production Environment File
          cat << 'EOF' > production.env
          ${{ secrets.ENV_FILE_PRODUCTION }}
          EOF
          
          # Force swarm overrides
          echo "" >> production.env
          echo "DB_HOST=mysql" >> production.env
          echo "REDIS_HOST=redis" >> production.env
          
          # 2. Upload Files to VPS
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/stacks"
          scp docker/swarm/production.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/stacks/production.yml
          scp production.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/stacks/production.env

          # 3. Deploy Stack via SSH
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash << 'ENDSSH'
            set -e

            # Export deployment variables
            export IMAGE_TAG="${{ github.sha }}"
            export GITHUB_REPOSITORY_OWNER="hiragiisme"
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📦 Pulling image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:production-${{ github.sha }}

            echo "🚀 Deploying stack..."
            cd ~/stacks
            export $(grep -v '^#' production.env | xargs) || true
            docker stack deploy \
              --compose-file production.yml \
              --with-registry-auth \
              --prune \
              laravel-production

            echo "✅ Deploy command sent!"
          ENDSSH
name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  guard:
    name: 🛡️ Deployment Guard
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')
    steps:
      - name: Confirm deployment
        run: echo "✅ Production deployment authorized"

  test:
    name: 🧪 Run Tests
    needs: guard
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, bcmath, gd, zip

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci && npm run build

      - name: Setup test env
        run: |
          cp .env.example .env.testing
          echo "APP_ENV=testing" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_DATABASE=laravel_test" >> .env.testing
          echo "DB_USERNAME=root" >> .env.testing
          echo "DB_PASSWORD=root" >> .env.testing

      - run: php artisan key:generate --env=testing
      - run: php artisan migrate --env=testing --force
      - run: php artisan test --env=testing

  build:
    name: 🏗️ Build Production Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy production stack
        run: scp docker-stack.production.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/stacks/

      - name: Deploy to Production Swarm
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            export DOCKER_REGISTRY=ghcr.io/${{ github.repository_owner }}
            export IMAGE_TAG=${{ github.sha }}
            export DB_DATABASE=${{ secrets.PRODUCTION_DB_DATABASE }}
            export DB_USERNAME=${{ secrets.PRODUCTION_DB_USERNAME }}
            export APP_KEY=${{ secrets.PRODUCTION_APP_KEY }}
            export PRODUCTION_APP_URL=${{ vars.PRODUCTION_APP_URL }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ github.repository }}:production-${{ github.sha }}

            # Rolling update dengan zero downtime
            docker stack deploy \
              --compose-file ~/stacks/docker-stack.production.yml \
              --with-registry-auth \
              laravel-production

            # Monitor rollout
            echo "⏳ Waiting for rollout..."
            sleep 60
            docker service ls | grep laravel-production
          ENDSSH

      - name: Health check production
        run: |
          sleep 30
          curl --fail --retry 10 --retry-delay 10 ${{ vars.PRODUCTION_APP_URL }}/api/health || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "docker service rollback laravel-production_app"